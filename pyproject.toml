[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crashdoc"
version = "0.1.0"
description = "NeoForge Log Doctor: diagnose Minecraft (NeoForge) crash logs with cited sources."
requires-python = ">=3.11"
# Runtime dependencies; keep identical to requirements.txt (Vercel reads either file, the docs do not say which wins)
dependencies = [
    "openai==2.54.0",
    "python-dotenv==1.2.4",
    "truststore==0.10.5",
    "pydantic==2.14.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "numpy==2.4.6",
    "rank-bm25==0.2.2",
    "tiktoken==0.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is part of the LLM cache key: do not reflow it to satisfy the line-length rule.
"src/crashdoc/extraction.py" = ["E501"]
"src/crashdoc/baselines.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.vercel]
# app.py puts src/ on the path and re-exports crashdoc.api:app (the package is not installed on Vercel)
entrypoint = "app:app"
