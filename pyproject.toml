[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crashdoc"
version = "0.1.0"
description = "NeoForge Log Doctor: diagnose Minecraft (NeoForge) crash logs with cited sources."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is part of the LLM cache key: do not reflow it to satisfy the line-length rule.
"src/crashdoc/extraction.py" = ["E501"]
"src/crashdoc/baselines.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.vercel]
# app.py puts src/ on the path and re-exports crashdoc.api:app (the package is not installed on Vercel)
entrypoint = "app:app"
